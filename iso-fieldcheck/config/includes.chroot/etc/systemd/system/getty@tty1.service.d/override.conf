# v1.1.2+ — autologin root on tty1 in the Field-Check Live ISO.
#
# The seller's-house workflow assumes operator has the server's
# keyboard + monitor, no laptop, no network. Skipping the login
# prompt means they sit down at the keyboard and see the field-check
# report immediately (via /root/.bash_profile which runs the report).
#
# Only tty1 — tty2-6 still show normal getty for shell access if
# needed. SSH (port 22) is also unaffected.
#
# Safe in this context because:
#   - Live ISO is read-only; no persistent root account to compromise
#   - DriveForge in field_check role has hard-disabled all destructive
#     drive operations (orchestrator-level refusal)
#   - The "attacker" who has physical console access could just yank
#     the USB stick and reboot from their own media anyway
#
# `--noissue` skips printing /etc/issue before login (we don't need
# the welcome banner; the field-report itself is the welcome).

[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear --noissue %I $TERM
